name: ESLint
on: 
  push:

permissions:
  contents: read

concurrency:
  group: "linter"
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v6.0.0
        with:
          node-version: 24.x
      - name: Run ESLint
        run: npm run lint
